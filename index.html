
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<meta name="description" content="Korax: Oraklet — Built for one. Open to everyone.">
<title>Korax: Oraklet ®</title>

<style>
/* ==========================================
   ORAKLET #6
   ========================================== */

@font-face {
  font-family: "Michelangelus";
  src: url("./fonts/Michelangelus-Regular.woff2") format("woff2");
  font-weight: 400;
  font-style: normal;
  font-display: swap;
}

@font-face {
  font-family: "Michelangelus";
  src: url("./fonts/Michelangelus-Italic.woff2") format("woff2");
  font-weight: 400;
  font-style: italic;
  font-display: swap;
}

@font-face {
  font-family: "Michelangelus";
  src: url("./fonts/Michelangelus-Bold.woff2") format("woff2");
  font-weight: 700;
  font-style: normal;
  font-display: swap;
}

@font-face {
  font-family: "Michelangelus";
  src: url("./fonts/Michelangelus-BoldItalic.woff2") format("woff2");
  font-weight: 700;
  font-style: italic;
  font-display: swap;
}

:root {
  color-scheme: dark;

  --black: #000;
  --white: #fff;
  --muted: #999;

  --display: "Michelangelus", Georgia, serif;
  --ui: Arial, Helvetica, sans-serif;

  --duration: 900;
}

* {
  box-sizing: border-box;
}

html,
body {
  width: 100%;
  height: 100%;
  margin: 0;
  padding: 0;

  overflow: hidden;
  overscroll-behavior: none;
}

html {
  position: fixed;
  inset: 0;
  width: 100%;
}

body {
  position: fixed;
  inset: 0;

  background: var(--black);
  color: var(--white);
  font-family: var(--ui);
  -webkit-font-smoothing: antialiased;

  overscroll-behavior: none;
  touch-action: none;
}

button,
a {
  -webkit-tap-highlight-color: transparent;
}

button {
  font: inherit;
}

.app {
  position: absolute;
  inset: 0;

  height: 100%;
  height: 100dvh;
  min-height: 0;

  padding: 20px;

  display: flex;
  flex-direction: column;
  gap: 14px;

  overflow: hidden;
  overscroll-behavior: none;
}

/* ==========================================
   HEADER / FOOTER
   ========================================== */

.header,
.footer {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  flex: none;
  min-width: 0;
}

.header {
  font-size: 13px;
}

.brand {
  display: inline-flex;
  align-items: baseline;
  gap: .35em;
  white-space: nowrap;
}

.brand a {
  color: inherit;
  text-decoration: none;
}

.brand a:hover {
  text-decoration: underline;
  text-underline-offset: 3px;
}

.version {
  white-space: nowrap;
}

.footer {
  font-size: 11px;
  color: var(--muted);
}

/* ==========================================
   NAVIGATION STAGE
   ========================================== */

.rail {
  position: relative;

  flex: 1;
  min-width: 0;
  min-height: 0;

  background: var(--black);
  overflow: hidden;

  border: 1px solid var(--white);

  touch-action: none;
  overscroll-behavior: none;
  isolation: isolate;
}

/* ==========================================
   PANELS
   ========================================== */

.panel {
  position: absolute;
  top: 0;
  left: 0;

  width: 0;
  height: 0;

  margin: 0;
  padding: 0;

  border: 0;
  border-radius: 0;

  background: var(--black);
  color: var(--white);

  overflow: hidden;
  outline: none;
  cursor: pointer;
}

.panel.active {
  cursor: default;
}

.panel:focus-visible {
  outline: 2px solid var(--white);
  outline-offset: -3px;
}

.panel-number {
  position: absolute;
  top: 14px;
  left: 14px;

  font-family: var(--ui);
  font-size: 11px;
  line-height: 1;
  color: var(--muted);

  pointer-events: none;
}

.panel-heading {
  position: absolute;
  top: 0;
  left: 0;

  margin: 0;
  padding: 0;

  font-family: var(--display);
  font-size: 76px;
  font-weight: 400;
  font-style: normal;
  line-height: 1.16;
  letter-spacing: -.025em;

  white-space: nowrap;
  transform-origin: 0 0;
  pointer-events: none;
}

.panel-detail {
  position: absolute;
  left: 24px;
  bottom: 22px;

  font-family: var(--ui);
  font-size: 11px;
  line-height: 1.3;
  color: var(--muted);

  white-space: nowrap;
  pointer-events: none;

  opacity: 0;
  transform: translateY(5px);

  transition:
    opacity 260ms ease,
    transform 400ms cubic-bezier(.22,1,.36,1);
}

.panel.active .panel-detail {
  opacity: 1;
  transform: translateY(0);
}

/* ==========================================
   ENTER LINK
   ========================================== */

.enter-link {
  position: absolute;
  left: 24px;
  top: calc(50% + 76px);

  display: inline-flex;
  align-items: center;
  gap: 12px;

  width: max-content;
  max-width: calc(100% - 48px);

  font-family: var(--ui);
  font-size: 12px;
  letter-spacing: .035em;

  color: var(--white);
  text-decoration: none;

  opacity: 0;
  visibility: hidden;
  transform: translateY(5px);

  transition:
    opacity 260ms ease,
    transform 400ms cubic-bezier(.22,1,.36,1),
    visibility 0s linear 260ms;

  pointer-events: none;
}

.panel.active .enter-link {
  opacity: 1;
  visibility: visible;
  transform: translateY(0);

  transition:
    opacity 260ms ease,
    transform 400ms cubic-bezier(.22,1,.36,1),
    visibility 0s;

  pointer-events: auto;
}

.enter-link:hover .enter-label {
  text-decoration: underline;
  text-underline-offset: 4px;
}

.enter-link:focus-visible {
  outline: 1px solid var(--white);
  outline-offset: 6px;
}

.enter-arrow {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 17px;
  height: 17px;
  flex: none;
}

.enter-arrow svg {
  display: block;
  width: 17px;
  height: 17px;

  fill: none;
  stroke: currentColor;
  stroke-width: 1.5;
  stroke-linecap: square;
  stroke-linejoin: miter;
}

/* ==========================================
   CORNER NAVIGATION
   ========================================== */

.nav-controls {
  position: absolute;
  top: 12px;
  right: 12px;

  display: flex;
  align-items: center;
  gap: 5px;

  z-index: 20;
  pointer-events: none;
}

.nav-button {
  width: 28px;
  height: 28px;

  display: grid;
  place-items: center;

  padding: 0;
  border: 1px solid transparent;
  border-radius: 0;

  background: var(--black);
  color: var(--white);

  cursor: pointer;
  pointer-events: auto;
  touch-action: manipulation;

  transition: border-color 180ms ease;
}

.nav-button:hover,
.nav-button:focus-visible {
  border-color: var(--white);
  outline: none;
}

.nav-button svg {
  width: 15px;
  height: 15px;

  fill: none;
  stroke: currentColor;
  stroke-width: 1.5;
  stroke-linecap: square;
  stroke-linejoin: miter;
}

/* ==========================================
   LINE LAYER
   ========================================== */

.lines {
  position: absolute;
  inset: 0;
  z-index: 10;
  pointer-events: none;
}

.line {
  position: absolute;
  background: var(--white);
}

.mobile-outline {
  position: absolute;
  border: 1px solid var(--white);
  pointer-events: none;
  display: none;
}

/* ==========================================
   MOBILE
   ========================================== */

@media (max-width: 700px) {
  .app {
    padding:
      max(10px, env(safe-area-inset-top))
      max(10px, env(safe-area-inset-right))
      max(10px, env(safe-area-inset-bottom))
      max(10px, env(safe-area-inset-left));

    gap: 10px;
  }

  .header {
    font-size: 11px;
  }

  .footer {
    font-size: 9px;
  }

  .panel-number {
    top: 10px;
    left: 10px;
    font-size: 10px;
  }

  .panel-heading {
    font-size: 64px;
  }

  .panel-detail {
    left: 12px;
    bottom: 14px;
    font-size: 9px;
  }

  .enter-link {
    left: 12px;
    top: calc(50% + 55px);
    font-size: 10px;
  }

  .nav-controls {
    top: 8px;
    right: 8px;
  }

  .nav-button {
    width: 26px;
    height: 26px;
  }

  .mobile-outline {
    display: block;
  }
}

@media (prefers-reduced-motion: reduce) {
  *,
  *::before,
  *::after {
    transition-duration: 0ms !important;
    animation-duration: 0ms !important;
  }
}
</style>
</head>

<body>

<div class="app">

  <header class="header">
    <div class="brand">
      <a href="https://korax.se/">Korax</a>
      <span>: Oraklet ®</span>
    </div>

    <span class="version">#6</span>
  </header>

  <main class="rail" aria-label="Main navigation">

    <!-- ARCHIVE -->

    <section
      class="panel active"
      data-section="archive"
      role="button"
      tabindex="0"
      aria-label="Select Archive"
      aria-current="true"
    >
      <span class="panel-number">01</span>

      <h2 class="panel-heading">Archive</h2>

      <span class="panel-detail">
        COLLECT / ORGANIZE / DISCOVER
      </span>

      <a class="enter-link" href="./archive/">
        <span class="enter-label">ENTER ARCHIVE</span>
        <span class="enter-arrow" aria-hidden="true">
          <svg viewBox="0 0 24 24">
            <path d="M5 19L19 5M8 5h11v11"/>
          </svg>
        </span>
      </a>
    </section>

    <!-- PLAYGROUND -->

    <section
      class="panel"
      data-section="playground"
      role="button"
      tabindex="0"
      aria-label="Select Playground"
    >
      <span class="panel-number">02</span>

      <h2 class="panel-heading">Playground</h2>

      <span class="panel-detail">
        EXPERIMENT / GENERATE / CREATE
      </span>

      <a class="enter-link" href="./playground/">
        <span class="enter-label">ENTER PLAYGROUND</span>
        <span class="enter-arrow" aria-hidden="true">
          <svg viewBox="0 0 24 24">
            <path d="M5 19L19 5M8 5h11v11"/>
          </svg>
        </span>
      </a>
    </section>

    <!-- STUDIO -->

    <section
      class="panel"
      data-section="studio"
      role="button"
      tabindex="0"
      aria-label="Select Studio"
    >
      <span class="panel-number">03</span>

      <h2 class="panel-heading">Studio</h2>

      <span class="panel-detail">
        COMPOSE / REFINE / EXPORT
      </span>

      <a class="enter-link" href="./studio/">
        <span class="enter-label">ENTER STUDIO</span>
        <span class="enter-arrow" aria-hidden="true">
          <svg viewBox="0 0 24 24">
            <path d="M5 19L19 5M8 5h11v11"/>
          </svg>
        </span>
      </a>
    </section>

    <!-- ORACLE -->

    <section
      class="panel"
      data-section="oracle"
      role="button"
      tabindex="0"
      aria-label="Select Oracle"
    >
      <span class="panel-number">04</span>

      <h2 class="panel-heading">Oracle</h2>

      <span class="panel-detail">
        THINK / CONNECT / EXPLORE
      </span>

      <a class="enter-link" href="./oracle/">
        <span class="enter-label">ENTER ORACLE</span>
        <span class="enter-arrow" aria-hidden="true">
          <svg viewBox="0 0 24 24">
            <path d="M5 19L19 5M8 5h11v11"/>
          </svg>
        </span>
      </a>
    </section>

    <!-- LINES -->

    <div class="lines" aria-hidden="true">
      <div class="line"></div>
      <div class="line"></div>
      <div class="line"></div>

      <div class="mobile-outline"></div>
      <div class="mobile-outline"></div>
      <div class="mobile-outline"></div>
      <div class="mobile-outline"></div>
    </div>

    <!-- NAVIGATION -->

    <nav class="nav-controls" aria-label="Section navigation">

      <button
        class="nav-button"
        id="nav-prev"
        type="button"
        aria-label="Previous section"
      >
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M19 12H5M12 5l-7 7 7 7"/>
        </svg>
      </button>

      <button
        class="nav-button"
        id="nav-next"
        type="button"
        aria-label="Next section"
      >
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M5 12h14M12 5l7 7-7 7"/>
        </svg>
      </button>

    </nav>

  </main>

  <footer class="footer">
    <span>BUILT FOR ONE.</span>
    <span>OPEN TO EVERYONE.</span>
  </footer>

</div>

<script>
(() => {
  "use strict";

  /* ========================================
     REFERENCES
     ======================================== */

  const rail = document.querySelector(".rail");

  const panels = [
    ...rail.querySelectorAll(".panel")
  ];

  const sections = panels.map(
    panel => panel.dataset.section
  );

  const lines = [
    ...rail.querySelectorAll(".line")
  ];

  const outlines = [
    ...rail.querySelectorAll(".mobile-outline")
  ];

  const controls = document.querySelector(".nav-controls");

  const prevButton = document.querySelector("#nav-prev");
  const nextButton = document.querySelector("#nav-next");

  const mobile = matchMedia("(max-width: 700px)");
  const reduced = matchMedia(
    "(prefers-reduced-motion: reduce)"
  );

  const DURATION = 900;

  let active = sections.includes(location.hash.slice(1))
    ? location.hash.slice(1)
    : "archive";

  let currentRects = new Map();
  let currentHeadings = new Map();

  let animation = null;
  let resizeFrame = 0;

  let pointerStart = null;
  let suppressClickUntil = 0;

  /* ========================================
     EASING
     ======================================== */

  function ease(t) {
    return 1 - Math.pow(1 - t, 4);
  }

  function lerp(a, b, t) {
    return a + (b - a) * t;
  }

  function interpolateRect(a, b, t) {
    return {
      x: lerp(a.x, b.x, t),
      y: lerp(a.y, b.y, t),
      w: lerp(a.w, b.w, t),
      h: lerp(a.h, b.h, t)
    };
  }

  function interpolateHeading(a, b, t) {
    return {
      x: lerp(a.x, b.x, t),
      y: lerp(a.y, b.y, t),
      scale: lerp(a.scale, b.scale, t),
      rotation: lerp(a.rotation, b.rotation, t)
    };
  }

  /* ========================================
     ORDER AND SLOTS
     ======================================== */

  function getOrder() {
    if (!mobile.matches) {
      return panels;
    }

    const start = sections.indexOf(active);

    return Array.from(
      { length: panels.length },
      (_, i) => panels[(start + i) % panels.length]
    );
  }

  function getTargetRects() {
    const w = rail.clientWidth;
    const h = rail.clientHeight;

    const result = new Map();

    if (mobile.matches) {
      const bottomH = Math.min(
        Math.max(h * .32, 100),
        h * .46
      );

      const topH = h - bottomH;
      const cellW = w / 3;

      const slots = [
        { x: 0, y: 0, w, h: topH },
        { x: 0, y: topH, w: cellW, h: bottomH },
        { x: cellW, y: topH, w: cellW, h: bottomH },
        {
          x: cellW * 2,
          y: topH,
          w: w - cellW * 2,
          h: bottomH
        }
      ];

      getOrder().forEach((panel, i) => {
        result.set(panel, slots[i]);
      });

      return result;
    }

    const closed = Math.min(64, w * .16);
    const open = Math.max(1, w - closed * 3);

    let x = 0;

    panels.forEach(panel => {
      const width = panel.dataset.section === active
        ? open
        : closed;

      result.set(panel, {
        x,
        y: 0,
        w: width,
        h
      });

      x += width;
    });

    return result;
  }

  /* ========================================
     HEADING GEOMETRY
     ======================================== */

  function getHeadingTarget(panel, rect) {
    const heading = panel.querySelector(".panel-heading");

    const textW = Math.max(1, heading.scrollWidth);
    const textH = Math.max(1, heading.offsetHeight);

    const isActive = panel.dataset.section === active;

    let x;
    let y;
    let scale;
    let rotation;

    if (mobile.matches) {
      if (isActive) {
        scale = Math.min(
          1.15,
          Math.max(.08, (rect.w - 24) / textW)
        );

        x = 12;
        y = (rect.h - textH * scale) / 2;
        rotation = 0;
      } else {
        scale = Math.min(
          .34,
          Math.max(.06, (rect.w - 16) / textW)
        );

        x = 8;
        y = rect.h - textH * scale - 12;
        rotation = 0;
      }
    } else {
      if (isActive) {
        scale = Math.min(
          1.2,
          Math.max(.08, (rect.w - 48) / textW)
        );

        x = 24;
        y = (rect.h - textH * scale) / 2;
        rotation = 0;
      } else {
        scale = Math.min(
          .24,
          Math.max(.06, (rect.h - 40) / textW)
        );

        x = rect.w - 14 - textH * scale;
        y = rect.h - 16;
        rotation = -90;
      }
    }

    return { x, y, scale, rotation };
  }

  /* ========================================
     RENDER
     ======================================== */

  function setRect(element, rect) {
    element.style.left = rect.x + "px";
    element.style.top = rect.y + "px";
    element.style.width = rect.w + "px";
    element.style.height = rect.h + "px";
  }

  function setHeading(panel, geometry) {
    const heading = panel.querySelector(".panel-heading");

    heading.style.transform =
      `translate(${geometry.x}px, ${geometry.y}px) ` +
      `rotate(${geometry.rotation}deg) ` +
      `scale(${geometry.scale})`;
  }

  function render(rects, headings) {
    panels.forEach(panel => {
      setRect(panel, rects.get(panel));
      setHeading(panel, headings.get(panel));
    });

    const activePanel = panels.find(
      panel => panel.dataset.section === active
    );

    const activeRect = rects.get(activePanel);

    controls.style.left =
      (activeRect.x + activeRect.w - controls.offsetWidth -
        (mobile.matches ? 8 : 12)) + "px";

    controls.style.top =
      (activeRect.y + (mobile.matches ? 8 : 12)) + "px";

    controls.style.right = "auto";

    if (mobile.matches) {
      lines.forEach(line => {
        line.style.display = "none";
      });

      panels.forEach((panel, i) => {
        const rect = rects.get(panel);

        outlines[i].style.display = "block";
        setRect(outlines[i], rect);
      });

    } else {
      outlines.forEach(outline => {
        outline.style.display = "none";
      });

      let boundary = 0;

      for (let i = 0; i < 3; i++) {
        boundary += rects.get(panels[i]).w;

        const line = lines[i];

        line.style.display = "block";
        line.style.left = boundary + "px";
        line.style.top = "0px";
        line.style.width = "1px";
        line.style.height = rail.clientHeight + "px";
      }
    }
  }

  /* ========================================
     ACTIVE STATES
     ======================================== */

  function updateActiveStates() {
    panels.forEach(panel => {
      const isActive =
        panel.dataset.section === active;

      panel.classList.toggle("active", isActive);

      if (isActive) {
        panel.setAttribute("aria-current", "true");
      } else {
        panel.removeAttribute("aria-current");
      }

      const link = panel.querySelector(".enter-link");
      link.tabIndex = isActive ? 0 : -1;
    });
  }

  /* ========================================
     ANIMATION ENGINE
     ======================================== */

  function stopAnimation() {
    if (animation !== null) {
      cancelAnimationFrame(animation);
      animation = null;
    }
  }

  function animateToTargets(instant = false) {
    stopAnimation();

    const targetRects = getTargetRects();
    const targetHeadings = new Map();

    panels.forEach(panel => {
      targetHeadings.set(
        panel,
        getHeadingTarget(panel, targetRects.get(panel))
      );
    });

    if (
      instant ||
      reduced.matches ||
      currentRects.size === 0
    ) {
      currentRects = targetRects;
      currentHeadings = targetHeadings;

      render(currentRects, currentHeadings);
      return;
    }

    const startRects = new Map(currentRects);
    const startHeadings = new Map(currentHeadings);

    const startTime = performance.now();

    function frame(now) {
      const progress = Math.min(
        1,
        (now - startTime) / DURATION
      );

      const t = ease(progress);

      const nextRects = new Map();
      const nextHeadings = new Map();

      panels.forEach(panel => {
        nextRects.set(
          panel,
          interpolateRect(
            startRects.get(panel),
            targetRects.get(panel),
            t
          )
        );

        nextHeadings.set(
          panel,
          interpolateHeading(
            startHeadings.get(panel),
            targetHeadings.get(panel),
            t
          )
        );
      });

      if (!mobile.matches) {
        let x = 0;

        panels.forEach((panel, index) => {
          const rect = nextRects.get(panel);

          rect.x = x;
          rect.y = 0;
          rect.h = rail.clientHeight;

          if (index === panels.length - 1) {
            rect.w = rail.clientWidth - x;
          }

          x += rect.w;
        });
      }

      currentRects = nextRects;
      currentHeadings = nextHeadings;

      render(currentRects, currentHeadings);

      if (progress < 1) {
        animation = requestAnimationFrame(frame);
      } else {
        animation = null;

        currentRects = targetRects;
        currentHeadings = targetHeadings;

        render(currentRects, currentHeadings);
      }
    }

    animation = requestAnimationFrame(frame);
  }

  /* ========================================
     NAVIGATION
     ======================================== */

  function activate(section, updateHistory = true) {
    if (!sections.includes(section)) return;
    if (section === active) return;

    active = section;

    updateActiveStates();
    animateToTargets(false);

    if (
      updateHistory &&
      location.hash.slice(1) !== section
    ) {
      history.pushState(null, "", "#" + section);
    }
  }

  function move(direction) {
    const index = sections.indexOf(active);

    const next = (
      index + direction + sections.length
    ) % sections.length;

    activate(sections[next]);
  }

  prevButton.addEventListener("click", () => {
    move(-1);
  });

  nextButton.addEventListener("click", () => {
    move(1);
  });

  /* ========================================
     PANEL CLICKS + KEYBOARD
     ======================================== */

  panels.forEach((panel, index) => {
    panel.addEventListener("click", event => {
      if (performance.now() < suppressClickUntil) {
        event.preventDefault();
        return;
      }

      if (event.target.closest("a")) {
        return;
      }

      activate(panel.dataset.section);
    });

    panel.addEventListener("keydown", event => {
      if (event.target.closest("a")) return;

      if (
        event.key === "Enter" ||
        event.key === " "
      ) {
        event.preventDefault();
        activate(panel.dataset.section);
        return;
      }

      let nextIndex = index;

      if (
        event.key === "ArrowRight" ||
        event.key === "ArrowDown"
      ) {
        nextIndex = (index + 1) % panels.length;

      } else if (
        event.key === "ArrowLeft" ||
        event.key === "ArrowUp"
      ) {
        nextIndex = (
          index - 1 + panels.length
        ) % panels.length;

      } else if (event.key === "Home") {
        nextIndex = 0;

      } else if (event.key === "End") {
        nextIndex = panels.length - 1;

      } else {
        return;
      }

      event.preventDefault();

      panels[nextIndex].focus();
      activate(panels[nextIndex].dataset.section);
    });
  });

  /* ========================================
     MOBILE SWIPE
     ======================================== */

  rail.addEventListener("pointerdown", event => {
    if (!mobile.matches) return;
    if (event.pointerType === "mouse") return;

    if (event.target.closest(".nav-controls")) {
      return;
    }

    if (event.target.closest(".enter-link")) {
      return;
    }

    pointerStart = {
      x: event.clientX,
      y: event.clientY,
      id: event.pointerId,
      time: performance.now()
    };
  });

  rail.addEventListener("pointerup", event => {
    if (!pointerStart) return;

    if (event.pointerId !== pointerStart.id) {
      return;
    }

    const dx = event.clientX - pointerStart.x;
    const dy = event.clientY - pointerStart.y;
    const elapsed = performance.now() - pointerStart.time;

    pointerStart = null;

    if (
      Math.abs(dx) < 45 ||
      Math.abs(dx) < Math.abs(dy) * 1.3 ||
      elapsed > 1200
    ) {
      return;
    }

    suppressClickUntil = performance.now() + 450;

    move(dx < 0 ? 1 : -1);
  });

  rail.addEventListener("pointercancel", () => {
    pointerStart = null;
  });

  /* ========================================
     HISTORY
     ======================================== */

  function syncURL() {
    const section = location.hash.slice(1);

    activate(
      sections.includes(section)
        ? section
        : "archive",
      false
    );
  }

  window.addEventListener("popstate", syncURL);
  window.addEventListener("hashchange", syncURL);

  /* ========================================
     RESIZE + VIEWPORT
     ======================================== */

  function handleResize() {
    cancelAnimationFrame(resizeFrame);

    resizeFrame = requestAnimationFrame(() => {
      stopAnimation();
      animateToTargets(true);
    });
  }

  const observer = new ResizeObserver(handleResize);
  observer.observe(rail);

  mobile.addEventListener("change", handleResize);

  if (window.visualViewport) {
    window.visualViewport.addEventListener(
      "resize",
      handleResize
    );
  }

  if (document.fonts) {
    document.fonts.ready.then(() => {
      animateToTargets(true);
    });
  }

  /* ========================================
     INITIALIZE
     ======================================== */

  updateActiveStates();
  animateToTargets(true);

})();
</script>

</body>
</html>
