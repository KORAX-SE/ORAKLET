
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<meta name="description" content="Oraklet — Built for one. Open to everyone.">
<title>Oraklet ® by Korax</title>

<style>
@font-face {
  font-family: Michelangelus;
  src: url("./fonts/Michelangelus-Regular.woff2") format("woff2");
  font-style: normal;
  font-weight: 400;
  font-display: swap;
}

@font-face {
  font-family: Michelangelus;
  src: url("./fonts/Michelangelus-Italic.woff2") format("woff2");
  font-style: italic;
  font-weight: 400;
  font-display: swap;
}

@font-face {
  font-family: Michelangelus;
  src: url("./fonts/Michelangelus-Bold.woff2") format("woff2");
  font-style: normal;
  font-weight: 700;
  font-display: swap;
}

@font-face {
  font-family: Michelangelus;
  src: url("./fonts/Michelangelus-BoldItalic.woff2") format("woff2");
  font-style: italic;
  font-weight: 700;
  font-display: swap;
}

:root {
  color-scheme: dark;
  --black: #000;
  --white: #fff;
  --muted: #aaa;
  --font: Michelangelus, Georgia, serif;
}

* {
  box-sizing: border-box;
}

html,
body {
  position: fixed;
  inset: 0;
  width: 100%;
  height: 100%;
  margin: 0;
  overflow: hidden;
  overscroll-behavior: none;
}

body {
  background: var(--black);
  color: var(--white);
  font-family: var(--font);
  -webkit-font-smoothing: antialiased;
  touch-action: none;
}

button,
a {
  font: inherit;
  color: inherit;
  -webkit-tap-highlight-color: transparent;
}

a {
  text-decoration: underline;
  text-underline-offset: 4px;
  text-decoration-thickness: 1px;
}

.app {
  position: absolute;
  inset: 0;
  display: flex;
  flex-direction: column;
  gap: 14px;
  height: 100%;
  height: 100dvh;
  min-height: 0;
  padding: 20px;
  overflow: hidden;
}

.header,
.footer {
  flex: none;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
}

.header {
  font-size: 15px;
}

.brand {
  display: inline-flex;
  align-items: baseline;
  gap: .3em;
  min-width: 0;
  white-space: nowrap;
}

.brand-link {
  display: inline-flex;
  align-items: center;
  gap: 5px;
}

.version {
  white-space: nowrap;
}

.footer {
  font-size: 12px;
  color: var(--muted);
}

/* =========================================
   LINK ARROWS
   ========================================= */

.link-arrow {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 15px;
  height: 15px;
  flex: none;
  text-decoration: none;
}

.link-arrow svg {
  display: block;
  width: 100%;
  height: 100%;
  fill: none;
  stroke: currentColor;
  stroke-width: 1.5;
  stroke-linecap: square;
  stroke-linejoin: miter;
}

.brand-link .link-arrow {
  width: 13px;
  height: 13px;
}

/* =========================================
   MAIN STAGE
   ========================================= */

.rail {
  position: relative;
  flex: 1;
  min-width: 0;
  min-height: 0;
  overflow: hidden;
  background: var(--black);
  touch-action: none;
  isolation: isolate;
}

/* Single border system */

.frame {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  z-index: 10;
  pointer-events: none;
  overflow: visible;
}

.frame path {
  fill: none;
  stroke: var(--white);
  stroke-width: 1;
  vector-effect: non-scaling-stroke;
  shape-rendering: crispEdges;
}

/* =========================================
   PANELS
   ========================================= */

.panel {
  position: absolute;
  top: 0;
  left: 0;
  width: 0;
  height: 0;
  padding: 0;
  margin: 0;
  border: 0;
  border-radius: 0;
  background: var(--black);
  color: var(--white);
  overflow: hidden;
  cursor: pointer;
}

.panel.active {
  cursor: default;
}

.panel:focus-visible {
  outline: 1px dashed var(--white);
  outline-offset: -5px;
}

.panel-number {
  position: absolute;
  top: 14px;
  left: 14px;
  font-size: 13px;
  line-height: 1;
  color: var(--muted);
  pointer-events: none;
}

.panel-heading {
  position: absolute;
  top: 0;
  left: 0;
  margin: 0;
  padding: 0;
  font-family: var(--font);
  font-size: 76px;
  font-weight: 400;
  line-height: 1.16;
  letter-spacing: -.025em;
  white-space: nowrap;
  transform-origin: 0 0;
  pointer-events: none;
}

.panel-detail {
  position: absolute;
  bottom: 22px;
  left: 24px;
  font-size: 13px;
  line-height: 1.25;
  white-space: nowrap;
  color: var(--muted);
  opacity: 0;
  transform: translateY(5px);
  transition:
    opacity 250ms ease,
    transform 350ms ease;
  pointer-events: none;
}

.panel.active .panel-detail {
  opacity: 1;
  transform: translateY(0);
}

/* =========================================
   ENTER LINKS
   ========================================= */

.enter-link {
  position: absolute;
  top: calc(50% + 76px);
  left: 24px;
  display: inline-flex;
  align-items: center;
  gap: 10px;
  max-width: calc(100% - 48px);
  font-size: 17px;
  line-height: 1.2;
  white-space: nowrap;
  opacity: 0;
  visibility: hidden;
  transform: translateY(5px);
  pointer-events: none;
  transition:
    opacity 250ms ease,
    transform 350ms ease,
    visibility 0s linear 250ms;
}

.panel.active .enter-link {
  opacity: 1;
  visibility: visible;
  transform: translateY(0);
  pointer-events: auto;
  transition:
    opacity 250ms ease,
    transform 350ms ease,
    visibility 0s;
}

/* =========================================
   NAVIGATION ARROWS
   ========================================= */

.nav-controls {
  position: absolute;
  top: 12px;
  left: 0;
  z-index: 20;
  display: flex;
  gap: 5px;
  pointer-events: none;
}

.nav-button {
  display: grid;
  place-items: center;
  width: 28px;
  height: 28px;
  padding: 0;
  border: 1px solid transparent;
  border-radius: 0;
  background: var(--black);
  color: var(--white);
  cursor: pointer;
  pointer-events: auto;
  touch-action: manipulation;
}

.nav-button:hover,
.nav-button:focus-visible {
  border-color: var(--white);
  outline: none;
}

.nav-button svg {
  width: 15px;
  height: 15px;
  fill: none;
  stroke: currentColor;
  stroke-width: 1.5;
  stroke-linecap: square;
  stroke-linejoin: miter;
}

/* =========================================
   MOBILE
   ========================================= */

@media (max-width: 700px) {
  .app {
    padding:
      max(10px, env(safe-area-inset-top))
      max(10px, env(safe-area-inset-right))
      max(10px, env(safe-area-inset-bottom))
      max(10px, env(safe-area-inset-left));
    gap: 10px;
  }

  .header {
    font-size: 13px;
  }

  .footer {
    font-size: 10px;
  }

  .panel-number {
    top: 10px;
    left: 10px;
    font-size: 12px;
  }

  .panel-heading {
    font-size: 64px;
  }

  .panel-detail {
    bottom: 14px;
    left: 12px;
    font-size: 11px;
  }

  .enter-link {
    top: calc(50% + 55px);
    left: 12px;
    font-size: 15px;
  }

  .nav-button {
    width: 26px;
    height: 26px;
  }

  .brand-link .link-arrow {
    width: 12px;
    height: 12px;
  }
}

@media (prefers-reduced-motion: reduce) {
  *,
  *::before,
  *::after {
    transition-duration: 0ms !important;
    animation-duration: 0ms !important;
  }
}
</style>
</head>

<body>
<div class="app">

  <header class="header">
    <div class="brand">
      <span>Oraklet ® by</span>

      <a
        class="brand-link"
        href="https://korax.se/"
        target="_blank"
        rel="noopener noreferrer"
      >
        <span>Korax</span>

        <!-- External link: diagonal arrow -->
        <span class="link-arrow" aria-hidden="true">
          <svg viewBox="0 0 24 24">
            <path d="M5 19L19 5M8 5h11v11"/>
          </svg>
        </span>
      </a>
    </div>

    <span class="version">Version #7</span>
  </header>

  <main class="rail" aria-label="Main navigation">

    <section
      class="panel active"
      data-section="archive"
      role="button"
      tabindex="0"
      aria-label="Select Archive"
      aria-current="true"
    >
      <span class="panel-number">01</span>
      <h2 class="panel-heading">Archive</h2>
      <span class="panel-detail">
        Collect / Organize / Discover
      </span>

      <a class="enter-link" href="./archive/">
        <span>Enter Archive</span>

        <!-- Internal link: right arrow -->
        <span class="link-arrow" aria-hidden="true">
          <svg viewBox="0 0 24 24">
            <path d="M5 12h14M12 5l7 7-7 7"/>
          </svg>
        </span>
      </a>
    </section>

    <section
      class="panel"
      data-section="playground"
      role="button"
      tabindex="0"
      aria-label="Select Playground"
    >
      <span class="panel-number">02</span>
      <h2 class="panel-heading">Playground</h2>
      <span class="panel-detail">
        Experiment / Generate / Create
      </span>

      <a class="enter-link" href="./playground/">
        <span>Enter Playground</span>

        <span class="link-arrow" aria-hidden="true">
          <svg viewBox="0 0 24 24">
            <path d="M5 12h14M12 5l7 7-7 7"/>
          </svg>
        </span>
      </a>
    </section>

    <section
      class="panel"
      data-section="studio"
      role="button"
      tabindex="0"
      aria-label="Select Studio"
    >
      <span class="panel-number">03</span>
      <h2 class="panel-heading">Studio</h2>
      <span class="panel-detail">
        Compose / Refine / Export
      </span>

      <a class="enter-link" href="./studio/">
        <span>Enter Studio</span>

        <span class="link-arrow" aria-hidden="true">
          <svg viewBox="0 0 24 24">
            <path d="M5 12h14M12 5l7 7-7 7"/>
          </svg>
        </span>
      </a>
    </section>

    <section
      class="panel"
      data-section="oracle"
      role="button"
      tabindex="0"
      aria-label="Select Oracle"
    >
      <span class="panel-number">04</span>
      <h2 class="panel-heading">Oracle</h2>
      <span class="panel-detail">
        Think / Connect / Explore
      </span>

      <a class="enter-link" href="./oracle/">
        <span>Enter Oracle</span>

        <span class="link-arrow" aria-hidden="true">
          <svg viewBox="0 0 24 24">
            <path d="M5 12h14M12 5l7 7-7 7"/>
          </svg>
        </span>
      </a>
    </section>

    <!-- SINGLE BORDER SYSTEM -->
    <svg class="frame" aria-hidden="true">
      <path id="frame-path"></path>
    </svg>

    <!-- SECTION NAVIGATION -->
    <nav class="nav-controls" aria-label="Section navigation">

      <button
        class="nav-button"
        id="nav-prev"
        type="button"
        aria-label="Previous section"
      >
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M19 12H5M12 5l-7 7 7 7"/>
        </svg>
      </button>

      <button
        class="nav-button"
        id="nav-next"
        type="button"
        aria-label="Next section"
      >
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M5 12h14M12 5l7 7-7 7"/>
        </svg>
      </button>

    </nav>
  </main>

  <footer class="footer">
    <span>Built for one.</span>
    <span>Open to everyone.</span>
  </footer>

</div>

<script>
(() => {
  "use strict";

  const rail = document.querySelector(".rail");
  const panels = [...rail.querySelectorAll(".panel")];
  const sections = panels.map(p => p.dataset.section);
  const frame = document.querySelector("#frame-path");
  const controls = document.querySelector(".nav-controls");
  const prev = document.querySelector("#nav-prev");
  const next = document.querySelector("#nav-next");

  const mobile = matchMedia("(max-width: 700px)");
  const reduced = matchMedia("(prefers-reduced-motion: reduce)");

  const DURATION = 850;

  let active = sections.includes(location.hash.slice(1))
    ? location.hash.slice(1)
    : "archive";

  let currentRects = new Map();
  let currentHeadings = new Map();
  let animation = null;
  let resizeFrame = 0;
  let pointerStart = null;
  let suppressClickUntil = 0;

  function lerp(a, b, t) {
    return a + (b - a) * t;
  }

  function ease(t) {
    return 1 - Math.pow(1 - t, 4);
  }

  function mixRect(a, b, t) {
    return {
      x: lerp(a.x, b.x, t),
      y: lerp(a.y, b.y, t),
      w: lerp(a.w, b.w, t),
      h: lerp(a.h, b.h, t)
    };
  }

  function mixHeading(a, b, t) {
    return {
      x: lerp(a.x, b.x, t),
      y: lerp(a.y, b.y, t),
      scale: lerp(a.scale, b.scale, t),
      rotation: lerp(a.rotation, b.rotation, t)
    };
  }

  function order() {
    if (!mobile.matches) return panels;

    const start = sections.indexOf(active);

    return Array.from(
      { length: 4 },
      (_, i) => panels[(start + i) % 4]
    );
  }

  function targets() {
    const w = rail.clientWidth;
    const h = rail.clientHeight;
    const result = new Map();

    if (mobile.matches) {
      const bottom = Math.min(
        Math.max(h * .32, 100),
        h * .46
      );

      const top = h - bottom;
      const third = w / 3;

      const slots = [
        { x: 0, y: 0, w, h: top },
        { x: 0, y: top, w: third, h: bottom },
        { x: third, y: top, w: third, h: bottom },
        {
          x: third * 2,
          y: top,
          w: w - third * 2,
          h: bottom
        }
      ];

      order().forEach((panel, i) => {
        result.set(panel, slots[i]);
      });

      return result;
    }

    const closed = Math.min(64, w * .16);
    const opened = Math.max(1, w - closed * 3);
    let x = 0;

    panels.forEach(panel => {
      const width = panel.dataset.section === active
        ? opened
        : closed;

      result.set(panel, { x, y: 0, w: width, h });
      x += width;
    });

    return result;
  }

  function headingTarget(panel, rect) {
    const heading = panel.querySelector(".panel-heading");
    const textW = Math.max(1, heading.scrollWidth);
    const textH = Math.max(1, heading.offsetHeight);
    const selected = panel.dataset.section === active;

    if (mobile.matches) {
      if (selected) {
        const scale = Math.min(1.15, (rect.w - 24) / textW);

        return {
          x: 12,
          y: (rect.h - textH * scale) / 2,
          scale,
          rotation: 0
        };
      }

      const scale = Math.min(.34, (rect.w - 16) / textW);

      return {
        x: 8,
        y: rect.h - textH * scale - 12,
        scale,
        rotation: 0
      };
    }

    if (selected) {
      const scale = Math.min(1.2, (rect.w - 48) / textW);

      return {
        x: 24,
        y: (rect.h - textH * scale) / 2,
        scale,
        rotation: 0
      };
    }

    const scale = Math.min(.24, (rect.h - 40) / textW);

    return {
      x: rect.w - 14 - textH * scale,
      y: rect.h - 16,
      scale,
      rotation: -90
    };
  }

  function setRect(element, r) {
    element.style.left = r.x + "px";
    element.style.top = r.y + "px";
    element.style.width = r.w + "px";
    element.style.height = r.h + "px";
  }

  /*
    Single SVG border system.

    Desktop:
    - Outer rectangle
    - Three vertical dividers

    Mobile:
    - Outer rectangle
    - One horizontal divider
    - Two lower vertical dividers
  */

  function drawFrame(rects) {
    const w = rail.clientWidth;
    const h = rail.clientHeight;

    const snap = value => Math.round(value) + .5;

    const right = snap(w - 1);
    const bottom = snap(h - 1);

    let d =
      `M .5 .5 H ${right} V ${bottom} ` +
      `H .5 Z`;

    if (mobile.matches) {
      const activePanel = panels.find(
        p => p.dataset.section === active
      );

      const activeRect = rects.get(activePanel);

      const y = snap(
        Math.max(
          0,
          Math.min(h, activeRect.y + activeRect.h)
        )
      );

      const x1 = snap(w / 3);
      const x2 = snap(w * 2 / 3);

      d += ` M .5 ${y} H ${right}`;
      d += ` M ${x1} ${y} V ${bottom}`;
      d += ` M ${x2} ${y} V ${bottom}`;

    } else {
      let x = 0;

      for (let i = 0; i < 3; i++) {
        x += rects.get(panels[i]).w;

        const sx = snap(x);

        d += ` M ${sx} .5 V ${bottom}`;
      }
    }

    frame.setAttribute("d", d);
  }

  function render(rects, headings) {
    panels.forEach(panel => {
      const rect = rects.get(panel);
      const heading = headings.get(panel);

      setRect(panel, rect);

      panel.querySelector(".panel-heading").style.transform =
        `translate(${heading.x}px, ${heading.y}px) ` +
        `rotate(${heading.rotation}deg) ` +
        `scale(${heading.scale})`;
    });

    drawFrame(rects);

    const selected = panels.find(
      panel => panel.dataset.section === active
    );

    const r = rects.get(selected);
    const inset = mobile.matches ? 8 : 12;

    controls.style.left =
      (r.x + r.w - controls.offsetWidth - inset) + "px";

    controls.style.top = (r.y + inset) + "px";
  }

  function updateStates() {
    panels.forEach(panel => {
      const selected = panel.dataset.section === active;

      panel.classList.toggle("active", selected);

      if (selected) {
        panel.setAttribute("aria-current", "true");
      } else {
        panel.removeAttribute("aria-current");
      }

      panel.querySelector(".enter-link").tabIndex =
        selected ? 0 : -1;
    });
  }

  function stopAnimation() {
    if (animation !== null) {
      cancelAnimationFrame(animation);
      animation = null;
    }
  }

  function animate(instant = false) {
    stopAnimation();

    const targetRects = targets();
    const targetHeadings = new Map();

    panels.forEach(panel => {
      targetHeadings.set(
        panel,
        headingTarget(panel, targetRects.get(panel))
      );
    });

    if (instant || reduced.matches || !currentRects.size) {
      currentRects = targetRects;
      currentHeadings = targetHeadings;
      render(currentRects, currentHeadings);
      return;
    }

    const startRects = new Map(currentRects);
    const startHeadings = new Map(currentHeadings);
    const startTime = performance.now();

    function tick(now) {
      const progress = Math.min(
        1,
        (now - startTime) / DURATION
      );

      const t = ease(progress);

      const nextRects = new Map();
      const nextHeadings = new Map();

      panels.forEach(panel => {
        nextRects.set(
          panel,
          mixRect(
            startRects.get(panel),
            targetRects.get(panel),
            t
          )
        );

        nextHeadings.set(
          panel,
          mixHeading(
            startHeadings.get(panel),
            targetHeadings.get(panel),
            t
          )
        );
      });

      if (!mobile.matches) {
        let x = 0;

        panels.forEach((panel, i) => {
          const r = nextRects.get(panel);

          r.x = x;
          r.y = 0;
          r.h = rail.clientHeight;

          if (i === panels.length - 1) {
            r.w = rail.clientWidth - x;
          }

          x += r.w;
        });
      }

      currentRects = nextRects;
      currentHeadings = nextHeadings;

      render(currentRects, currentHeadings);

      if (progress < 1) {
        animation = requestAnimationFrame(tick);
      } else {
        animation = null;
        currentRects = targetRects;
        currentHeadings = targetHeadings;
        render(currentRects, currentHeadings);
      }
    }

    animation = requestAnimationFrame(tick);
  }

  function activate(section, updateURL = true) {
    if (!sections.includes(section) || section === active) {
      return;
    }

    active = section;
    updateStates();
    animate();

    if (updateURL && location.hash.slice(1) !== section) {
      history.pushState(null, "", "#" + section);
    }
  }

  function move(direction) {
    const index = sections.indexOf(active);

    const nextIndex =
      (index + direction + sections.length) % sections.length;

    activate(sections[nextIndex]);
  }

  prev.addEventListener("click", () => move(-1));
  next.addEventListener("click", () => move(1));

  panels.forEach((panel, index) => {
    panel.addEventListener("click", event => {
      if (performance.now() < suppressClickUntil) {
        event.preventDefault();
        return;
      }

      if (event.target.closest("a")) return;

      activate(panel.dataset.section);
    });

    panel.addEventListener("keydown", event => {
      if (event.target.closest("a")) return;

      if (event.key === "Enter" || event.key === " ") {
        event.preventDefault();
        activate(panel.dataset.section);
        return;
      }

      let nextIndex;

      switch (event.key) {
        case "ArrowRight":
        case "ArrowDown":
          nextIndex = (index + 1) % panels.length;
          break;

        case "ArrowLeft":
        case "ArrowUp":
          nextIndex =
            (index - 1 + panels.length) % panels.length;
          break;

        case "Home":
          nextIndex = 0;
          break;

        case "End":
          nextIndex = panels.length - 1;
          break;

        default:
          return;
      }

      event.preventDefault();

      panels[nextIndex].focus();

      activate(panels[nextIndex].dataset.section);
    });
  });

  /* =========================================
     MOBILE SWIPE
     ========================================= */

  rail.addEventListener("pointerdown", event => {
    if (!mobile.matches || event.pointerType === "mouse") {
      return;
    }

    if (event.target.closest(".nav-controls, .enter-link")) {
      return;
    }

    pointerStart = {
      x: event.clientX,
      y: event.clientY,
      id: event.pointerId,
      time: performance.now()
    };
  });

  rail.addEventListener("pointerup", event => {
    if (!pointerStart || event.pointerId !== pointerStart.id) {
      return;
    }

    const dx = event.clientX - pointerStart.x;
    const dy = event.clientY - pointerStart.y;
    const elapsed = performance.now() - pointerStart.time;

    pointerStart = null;

    if (
      Math.abs(dx) < 45 ||
      Math.abs(dx) < Math.abs(dy) * 1.3 ||
      elapsed > 1200
    ) {
      return;
    }

    suppressClickUntil = performance.now() + 450;

    move(dx < 0 ? 1 : -1);
  });

  rail.addEventListener("pointercancel", () => {
    pointerStart = null;
  });

  /* =========================================
     HISTORY
     ========================================= */

  function syncURL() {
    const section = location.hash.slice(1);

    activate(
      sections.includes(section) ? section : "archive",
      false
    );
  }

  window.addEventListener("popstate", syncURL);
  window.addEventListener("hashchange", syncURL);

  /* =========================================
     RESIZE
     ========================================= */

  function handleResize() {
    cancelAnimationFrame(resizeFrame);

    resizeFrame = requestAnimationFrame(() => {
      animate(true);
    });
  }

  const observer = new ResizeObserver(handleResize);
  observer.observe(rail);

  mobile.addEventListener("change", handleResize);

  if (window.visualViewport) {
    window.visualViewport.addEventListener(
      "resize",
      handleResize
    );
  }

  if (document.fonts) {
    document.fonts.ready.then(() => animate(true));
  }

  updateStates();
  animate(true);

})();
</script>
</body>
</html>
