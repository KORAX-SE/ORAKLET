
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#000000">
<meta name="description" content="Oraklet — Built for one. Open to everyone.">
<title>Oraklet — 0.3</title>

<style>
:root {
  color-scheme: dark;
  --bg: #000;
  --fg: #fff;
  --muted: #999;
  --line: #fff;
  --speed: 900ms;
  --ease: cubic-bezier(.22,1,.36,1);
  --closed: 64px;
}

* { box-sizing: border-box; }

html,body {
  width: 100%;
  height: 100%;
  margin: 0;
}

body {
  background: var(--bg);
  color: var(--fg);
  font-family: Arial,Helvetica,sans-serif;
  -webkit-font-smoothing: antialiased;
}

button { font: inherit; }

.app {
  height: 100dvh;
  min-height: 350px;
  padding: 20px;
  display: flex;
  flex-direction: column;
  gap: 14px;
}

.header,.footer {
  flex: none;
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 12px;
}

.header { font-size: 13px; }

.footer {
  font-size: 11px;
  color: var(--muted);
}

.rail {
  position: relative;
  flex: 1;
  min-height: 0;
  width: 100%;
  overflow: hidden;
  border: 1px solid var(--line);
  background: #000;
}

.panel {
  position: absolute;
  top: 0;
  left: 0;
  width: 0;
  height: 0;
  padding: 0;
  margin: 0;
  border: 0;
  border-radius: 0;
  background: #000;
  color: #fff;
  text-align: left;
  cursor: pointer;
  overflow: hidden;
  isolation: isolate;

  transition:
    left var(--speed) var(--ease),
    top var(--speed) var(--ease),
    width var(--speed) var(--ease),
    height var(--speed) var(--ease);
}

.panel::after {
  content: "";
  position: absolute;
  inset: 0;
  border-right: 1px solid var(--line);
  pointer-events: none;
}

.panel:last-child::after {
  border-right: 0;
}

.panel:focus-visible {
  outline: 2px solid #fff;
  outline-offset: -3px;
  z-index: 10;
}

.panel.active { cursor: default; }

.number {
  position: absolute;
  top: 14px;
  left: 14px;
  font-size: 11px;
  color: var(--muted);
  pointer-events: none;
}

.heading {
  position: absolute;
  top: 0;
  left: 0;
  display: block;
  margin: 0;
  font-size: 64px;
  line-height: 1;
  font-weight: 400;
  letter-spacing: -.045em;
  white-space: nowrap;
  transform-origin: 0 0;
  pointer-events: none;

  transform:
    translate(var(--tx,0px),var(--ty,0px))
    rotate(var(--rot,0deg))
    scale(var(--scale,1));

  transition:
    transform var(--speed) var(--ease);
}

.detail {
  position: absolute;
  left: 24px;
  bottom: 22px;
  font-size: 11px;
  color: var(--muted);
  white-space: nowrap;
  pointer-events: none;
  opacity: 0;
  transform: translateY(6px);
  transition:
    opacity 350ms ease,
    transform 550ms var(--ease);
}

.panel.active .detail {
  opacity: 1;
  transform: translateY(0);
}

@media(max-width:700px) {
  .app {
    padding: 10px;
    gap: 10px;
  }

  .header { font-size: 11px; }
  .footer { font-size: 9px; }

  .panel::after {
    border-right: 1px solid var(--line);
    border-bottom: 1px solid var(--line);
  }

  .number {
    top: 10px;
    left: 10px;
    font-size: 10px;
  }

  .detail {
    left: 12px;
    bottom: 14px;
    font-size: 9px;
  }
}

@media(prefers-reduced-motion:reduce) {
  *,*::before,*::after {
    transition-duration: 0ms !important;
    animation-duration: 0ms !important;
  }
}
</style>
</head>

<body>
<div class="app">

<header class="header">
  <span>ORAKLET®</span>
  <span>VERSION / 0.3</span>
</header>

<main class="rail" aria-label="Main navigation">

  <button class="panel" data-section="archive"
          aria-pressed="false">
    <span class="number">01</span>
    <span class="heading">ARCHIVE</span>
    <span class="detail">
      COLLECT / ORGANIZE / DISCOVER
    </span>
  </button>

  <button class="panel" data-section="playground"
          aria-pressed="false">
    <span class="number">02</span>
    <span class="heading">PLAYGROUND</span>
    <span class="detail">
      EXPERIMENT / GENERATE / CREATE
    </span>
  </button>

  <button class="panel" data-section="studio"
          aria-pressed="false">
    <span class="number">03</span>
    <span class="heading">STUDIO</span>
    <span class="detail">
      COMPOSE / REFINE / EXPORT
    </span>
  </button>

  <button class="panel" data-section="oracle"
          aria-pressed="false">
    <span class="number">04</span>
    <span class="heading">ORACLE</span>
    <span class="detail">
      THINK / CONNECT / EXPLORE
    </span>
  </button>

</main>

<footer class="footer">
  <span>BUILT FOR ONE.</span>
  <span>OPEN TO EVERYONE.</span>
</footer>

</div>

<script>
(() => {
  "use strict";

  const rail = document.querySelector(".rail");
  const panels = [...rail.querySelectorAll(".panel")];
  const sections = panels.map(p => p.dataset.section);

  const mobile = matchMedia("(max-width:700px)");
  const reduced = matchMedia(
    "(prefers-reduced-motion:reduce)"
  );

  let active = sections.includes(location.hash.slice(1))
    ? location.hash.slice(1)
    : "archive";

  let initialized = false;
  let resizeFrame = 0;

  /*
   * CYCLIC ORDER
   *
   * The active panel is slot 0.
   * Remaining panels follow in their original order,
   * wrapping around at the end.
   *
   * ARCHIVE -> PLAYGROUND -> STUDIO -> ORACLE
   */

  function orderedPanels() {
    const start = sections.indexOf(active);

    return Array.from({length:panels.length},(_,i) => {
      return panels[(start+i)%panels.length];
    });
  }

  function getSlots() {
    const w = rail.clientWidth;
    const h = rail.clientHeight;

    if (mobile.matches) {
      const bottomH = Math.min(
        Math.max(h*.35,110),
        h*.48
      );

      const topH = h-bottomH;
      const cellW = w/3;

      return [
        {x:0,y:0,w:w,h:topH},
        {x:0,y:topH,w:cellW,h:bottomH},
        {x:cellW,y:topH,w:cellW,h:bottomH},
        {x:cellW*2,y:topH,w:w-cellW*2,h:bottomH}
      ];
    }

    const closed = Math.min(64,w*.16);
    const open = Math.max(1,w-closed*3);

    return [
      {x:0,y:0,w:open,h:h},
      {x:open,y:0,w:closed,h:h},
      {x:open+closed,y:0,w:closed,h:h},
      {x:open+closed*2,y:0,w:closed,h:h}
    ];
  }

  /*
   * Text positioning is based on TARGET slot
   * dimensions, not the panel's current dimensions.
   *
   * This fixes the disappearing labels in v0.2.
   */

  function setHeading(panel,slot,isActive) {
    const heading = panel.querySelector(".heading");

    const textW = heading.scrollWidth;
    const textH = heading.offsetHeight;

    let x,y,scale,rotation;

    if (mobile.matches) {
      if (isActive) {
        scale = Math.min(
          1,
          (slot.w-24)/textW
        );

        x = 12;
        y = (slot.h-textH*scale)/2;
      } else {
        scale = Math.min(
          .36,
          (slot.w-16)/textW
        );

        x = 8;
        y = slot.h-textH*scale-12;
      }

      rotation = 0;

    } else if (isActive) {
      scale = Math.min(
        1.25,
        (slot.w-48)/textW
      );

      x = 24;
      y = (slot.h-textH*scale)/2;
      rotation = 0;

    } else {
      /*
       * Rotated text extends UP from the anchor.
       * Its full length remains inside the panel.
       */
      scale = Math.min(
        .25,
        (slot.h-45)/textW
      );

      x = slot.w-14-textH*scale;
      y = slot.h-16;
      rotation = -90;
    }

    scale = Math.max(.05,scale);

    heading.style.setProperty("--tx",x+"px");
    heading.style.setProperty("--ty",y+"px");
    heading.style.setProperty("--rot",rotation+"deg");
    heading.style.setProperty("--scale",scale);
  }

  function layout(instant=false) {
    const order = orderedPanels();
    const slots = getSlots();

    if (instant) {
      rail.classList.add("instant");
      panels.forEach(p => {
        p.style.transition = "none";
        p.querySelector(".heading").style.transition = "none";
      });
    }

    order.forEach((panel,index) => {
      const slot = slots[index];
      const isActive = index===0;

      panel.classList.toggle("active",isActive);
      panel.setAttribute("aria-pressed",String(isActive));

      panel.style.left = slot.x+"px";
      panel.style.top = slot.y+"px";
      panel.style.width = slot.w+"px";
      panel.style.height = slot.h+"px";

      setHeading(panel,slot,isActive);
    });

    if (instant) {
      /*
       * Force layout before enabling transitions.
       * Prevents initial page-load animation.
       */
      void rail.offsetWidth;

      panels.forEach(p => {
        p.style.transition = "";
        p.querySelector(".heading").style.transition = "";
      });

      rail.classList.remove("instant");
    }

    initialized = true;
  }

  function activate(section,writeHistory=true) {
    if (!sections.includes(section)) return;
    if (section===active && initialized) return;

    active = section;

    /*
     * All four panels move directly toward their
     * new slots using the same timing.
     *
     * CSS transitions automatically continue from
     * their current interpolated positions.
     */
    layout(false);

    if (writeHistory &&
        location.hash.slice(1)!==section) {
      history.pushState(null,"","#"+section);
    }
  }

  panels.forEach((panel,index) => {
    panel.addEventListener("click",() => {
      activate(panel.dataset.section);
    });

    panel.addEventListener("keydown",event => {
      let next = index;

      if (
        event.key==="ArrowRight" ||
        event.key==="ArrowDown"
      ) {
        next=(index+1)%panels.length;

      } else if (
        event.key==="ArrowLeft" ||
        event.key==="ArrowUp"
      ) {
        next=(index-1+panels.length)%panels.length;

      } else if(event.key==="Home") {
        next=0;

      } else if(event.key==="End") {
        next=panels.length-1;

      } else {
        return;
      }

      event.preventDefault();

      panels[next].focus();
      activate(panels[next].dataset.section);
    });
  });

  function syncURL() {
    const section=location.hash.slice(1);
    activate(
      sections.includes(section) ? section : "archive",
      false
    );
  }

  window.addEventListener("popstate",syncURL);
  window.addEventListener("hashchange",syncURL);

  function handleResize() {
    cancelAnimationFrame(resizeFrame);
    resizeFrame=requestAnimationFrame(() => {
      layout(true);
    });
  }

  const observer=new ResizeObserver(handleResize);
  observer.observe(rail);

  mobile.addEventListener("change",handleResize);

  /*
   * Font loading can change heading dimensions.
   */
  if (document.fonts) {
    document.fonts.ready.then(() => layout(true));
  }

  layout(true);
})();
</script>
</body>
</html>
